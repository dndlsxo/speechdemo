name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk SpeechMemo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechMemo-apk
          path: SpeechMemo.apk

      - name: Publish to the "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SpeechMemo.apk \
            --title "발표 암기 최신 빌드" \
            --notes "자동 빌드 ${GITHUB_SHA::7}. SpeechMemo.apk를 휴대폰에서 받아 설치하세요."
